<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cherry Boom | Joyas Artesanales</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: #fff5f7;
    color: #333;
}

header {
    background: linear-gradient(135deg, #ff8fa3, #ffc2d1);
    color: white;
    text-align: center;
    padding: 30px;
}

header h1 {
    margin: 0;
    font-size: 45px;
}

nav {
    text-align: center;
    padding: 15px;
    background: #ffe0e9;
}

nav a {
    margin: 0 15px;
    text-decoration: none;
    color: #444;
    font-weight: bold;
}

.hero {
    text-align: center;
    padding: 50px 20px;
}

.hero h2 {
    font-size: 32px;
}

.productos {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 25px;
    padding: 20px;
}

.producto {
    background: white;
    border-radius: 15px;
    padding: 15px;
    width: 250px;
    text-align: center;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    transition: transform 0.2s;
}

.producto:hover {
    transform: scale(1.05);
}

.producto img {
    width: 100%;
    border-radius: 10px;
}

button {
    background: #ff8fa3;
    border: none;
    padding: 10px 15px;
    color: white;
    border-radius: 8px;
    cursor: pointer;
}

footer {
    text-align: center;
    padding: 20px;
    background: #ff8fa3;
    color: white;
    margin-top: 30px;
}
</style>

</head>

<body>

<header>
    <h1>🍒 Cherry Boom</h1>
    <p>Joyas artesanales hechas con amor 💎</p>
</header>

<nav>
    <a href="#">Inicio</a>
    <a href="#">Productos</a>
    <a href="#">Contacto</a>
</nav>

<section class="hero">
    <h2>Diseños únicos y elegantes ✨</h2>
    <p>Cada pieza es hecha a mano con dedicación</p>
</section>

<section class="productos">

    <div class="producto">
        <img src="https://images.unsplash.com/photo-1611591437281-460bfbe1220a" alt="">
        <h3>Collar artesanal</h3>
        <p>$35.000</p>
        <button>Comprar</button>
    </div>

    <div class="producto">
        <img src="https://images.unsplash.com/photo-1588449668365-d15e397f6787" alt="">
        <h3>Anillo elegante</h3>
        <p>$25.000</p>
        <button>Comprar</button>
    </div>

    <div class="producto">
        <img src="https://images.unsplash.com/photo-1602752250015-52934bc45613" alt="">
        <h3>Pulsera artesanal</h3>
        <p>$28.000</p>
        <button>Comprar</button>
    </div>

</section>

<footer>
    <p>© 2026 Cherry Boom | Contáctanos por WhatsApp 📱</p>
</footer>

</body>
</html>
